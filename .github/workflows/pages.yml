name: Publier la version claude
# Ce workflow ne publie QUE la branche claude, dans le dossier /claude/ de la
# branche « gh-pages ». Il ne touche jamais aux autres dossiers de gh-pages.
on:
  push:
    branches: [claude]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gh-pages-write
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche claude
        uses: actions/checkout@v6
        with:
          path: src
          persist-credentials: false
      - name: Construire la version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          src, dst = Path('src'), Path('out')
          dst.mkdir()
          for item in src.iterdir():
              if item.is_file() and (item.suffix.lower() in {'.html', '.css', '.js', '.ico', '.svg', '.webmanifest'} or item.name == '.nojekyll'):
                  shutil.copy2(item, dst / item.name)
          shutil.copytree(src / 'assets', dst / 'assets')
          if not (dst / 'index.html').is_file():
              raise RuntimeError('Page accueil manquante')
          for path in dst.rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              text = text.replace('</head>', '<meta name="robots" content="noindex, nofollow" />\n</head>')
              path.write_text(text, encoding='utf-8')
          PY
      - name: Pousser dans gh-pages/claude
        run: |
          set -e
          REPO="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads "$REPO" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$REPO" site
          else
            git init -b gh-pages site
            git -C site remote add origin "$REPO"
          fi
          rm -rf site/claude
          mkdir -p site/claude
          cp -a out/. site/claude/
          touch site/.nojekyll
          cd site
          git add -A
          if git diff --cached --quiet; then echo "Rien à publier"; exit 0; fi
          git commit -m "Publier claude@${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push origin gh-pages && exit 0
            git pull --rebase origin gh-pages
          done
          exit 1
